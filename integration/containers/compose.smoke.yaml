# Disposable synthetic services; no budget gateway or ledger.
name: emmet4930-synthetic-smoke
services:
  mesh:
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: mesh
    networks:
    - backend
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      AI_DATABASE_NAME: ai_db_staging
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    networks:
    - backend
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: fixture_owner
      POSTGRES_DB: ai_db_staging
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
    - smoke-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U fixture_owner -d ai_db_staging
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    # Synthetic broker only (BE/infra own the real one). Same RabbitMQ line as the BE; credentials are synthetic.
    image: rabbitmq:4.4.0-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407
    networks:
    - backend
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      RABBITMQ_DEFAULT_USER: synthetic_mq
      RABBITMQ_DEFAULT_PASS: example-synthetic-mq
      RABBITMQ_DEFAULT_VHOST: gift
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - check_port_connectivity
      interval: 3s
      timeout: 10s
      retries: 40
  qa-init:
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: qa-init
    networks:
    - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      AI_DATABASE_NAME: ai_db_staging
    volumes:
    - smoke-data:/shared
    - &id001
      type: bind
      source: ${EMMET_MODEL_DIR:?existing verified models directory}
      target: /assets/models
      read_only: true
      bind:
        create_host_path: false
    restart: 'no'
  search:
    network_mode: service:mesh
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
    - /run/runtime:uid=10001,gid=10001,mode=0700
    restart: 'no'
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: search
    command:
    - search
    depends_on:
      mesh:
        condition: service_started
      qa-init:
        condition: service_completed_successfully
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      AI_SERVICE_TOKEN_FILE: /run/fixture/ai_service_token
      PORT: '8000'
      SEARCH_CATALOG_DATABASE_URL_FILE: /run/fixture/search_db
      SEARCH_MEDIA_ROOT: /run/fixture/media
      AI_DATABASE_NAME: ai_db_staging
    volumes:
    - smoke-data:/run/fixture:ro
    - search-cache:/runtime
    - *id001
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - integration.containers.health
      - search
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 20
  backend:
    network_mode: service:mesh
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
    - /run/runtime:uid=10001,gid=10001,mode=0700
    restart: 'no'
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: backend-smoke
    command:
    - backend
    depends_on:
      mesh:
        condition: service_started
      qa-init:
        condition: service_completed_successfully
      search:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      AI_SERVICE_TOKEN_FILE: /run/fixture/ai_service_token
      PORT: '8002'
      LIVE_BACKEND_STATE: /run/fixture/backend-state.json
      LIVE_BACKEND_AMQP_URL: amqp://synthetic_mq:example-synthetic-mq@rabbitmq:5672/gift
      SEARCH_URL: http://127.0.0.1:8000
      AI_DATABASE_NAME: ai_db_staging
    volumes:
    - smoke-data:/run/fixture
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - integration.containers.health
      - backend
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 20
  profiler:
    network_mode: service:mesh
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
    - /run/runtime:uid=10001,gid=10001,mode=0700
    restart: 'no'
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: profiler-smoke
    command:
    - profiler-smoke
    depends_on:
      mesh:
        condition: service_started
      qa-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      search:
        condition: service_healthy
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      AI_SERVICE_TOKEN_FILE: /run/fixture/ai_service_token
      PORT: '8001'
      PROFILING_DATABASE_URL_FILE: /run/fixture/profiler_db
      OPENROUTER_API_KEY_PROFILER_FILE: /run/fixture/openrouter_key
      EMMET_FIXTURE_MODE: /run/fixture/provider-mode.json
      PROFILING_MQ_ENABLED: 'true'
      PROFILING_MQ_URL: amqp://synthetic_mq:example-synthetic-mq@rabbitmq:5672/gift
      PROFILING_MQ_PREFETCH: '2'
      PROFILING_MQ_SLOTS: '2'
      PROFILING_MQ_RECONNECT_DELAY_S: '1'
      PROFILING_MQ_SHUTDOWN_GRACE_S: '5'
      PROFILING_MQ_CONFIRM_TIMEOUT_S: '5'
      PROFILING_MQ_WAIT_S: '1'
      PROFILING_MQ_MAX_ANALYSIS_ATTEMPTS: '3'
      PROFILING_MQ_RETRY_BASE_S: '1'
      PROFILING_MQ_RETRY_MAX_S: '5'
      PROFILING_MQ_RECONCILE_AFTER_S: '60'
      PROFILING_MQ_RECONCILE_INTERVAL_S: '30'
      AI_DATABASE_NAME: ai_db_staging
      PROFILING_APP_DB_ROLE: ai_profiler_service
    volumes:
    - smoke-data:/run/fixture:ro
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - integration.containers.health
      - profiler
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 20
  chat:
    network_mode: service:mesh
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
    - /run/runtime:uid=10001,gid=10001,mode=0700
    restart: 'no'
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: chat-smoke
    command:
    - chat-smoke
    depends_on:
      mesh:
        condition: service_started
      qa-init:
        condition: service_completed_successfully
      search:
        condition: service_healthy
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      AI_SERVICE_TOKEN_FILE: /run/fixture/ai_service_token
      PORT: '7860'
      DATABASE_URL_FILE: /run/fixture/chat_db
      SEARCH_URL: http://127.0.0.1:8000
      INTERNAL_URL: http://127.0.0.1:7860
      COOKIE_SECURE: 'false'
      SESSION_SECRET_FILE: /run/fixture/session_secret
      QA_ADMIN_PASSWORD_FILE: /run/fixture/qa_admin_password
      DEMO_ACCESS_TOKEN_FILE: /run/fixture/demo_access_token
      AI_DATABASE_NAME: ai_db_staging
    volumes:
    - smoke-data:/run/fixture:ro
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - integration.containers.health
      - chat
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 20
  console:
    networks:
    - backend
    - console-ingress
    ports:
    - 127.0.0.1:18811:18800
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
    - /run/runtime:uid=10001,gid=10001,mode=0700
    restart: 'no'
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: console-smoke
    command:
    - console
    depends_on:
      mesh:
        condition: service_started
      qa-init:
        condition: service_completed_successfully
      chat:
        condition: service_healthy
      profiler:
        condition: service_healthy
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      AI_SERVICE_TOKEN_FILE: /run/fixture/ai_service_token
      PORT: '18800'
      CONSOLE_SERVICE_HOST: mesh
      CONSOLE_ADMIN_ORIGIN: http://127.0.0.1:18811
      CONSOLE_ADMIN_HASH_FILE: /run/fixture/console_admin.hash
      CONSOLE_ADMIN_SESSION_FILE: /runtime/admin-session/sessions.sqlite3
      DATABASE_URL_FILE: /run/fixture/console_db
      AI_DATABASE_NAME: ai_db_staging
    volumes:
    - smoke-data:/run/fixture:ro
    - console-cache:/runtime
  smoke-check:
    network_mode: service:mesh
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
    - /run/runtime:uid=10001,gid=10001,mode=0700
    restart: 'no'
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: smoke-check
    depends_on:
      console:
        condition: service_started
    volumes:
    - smoke-data:/run/fixture:ro
    profiles:
    - check
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      AI_DATABASE_NAME: ai_db_staging
  fault-missing-assets:
    network_mode: service:mesh
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
    - /run/runtime:uid=10001,gid=10001,mode=0700
    - /runtime:uid=10001,gid=10001,mode=0700
    restart: 'no'
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: search
    command:
    - search
    depends_on:
      mesh:
        condition: service_started
      qa-init:
        condition: service_completed_successfully
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      AI_SERVICE_TOKEN_FILE: /run/fixture/ai_service_token
      PORT: '8011'
      SEARCH_CATALOG_DATABASE_URL_FILE: /run/fixture/search_db
      SEARCH_MEDIA_ROOT: /run/fixture/media
      AI_DATABASE_NAME: ai_db_staging
    volumes:
    - smoke-data:/run/fixture:ro
    profiles:
    - faults
  fault-unready-db:
    network_mode: service:mesh
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
    - /run/runtime:uid=10001,gid=10001,mode=0700
    restart: 'no'
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: profiler-smoke
    command:
    - profiler-smoke
    depends_on:
      mesh:
        condition: service_started
      qa-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      search:
        condition: service_healthy
    environment:
      INTEGRATION_SYNTHETIC_ONLY: '1'
      AI_SERVICE_TOKEN_FILE: /run/fixture/ai_service_token
      PORT: '8011'
      PROFILING_DATABASE_URL_FILE: /run/fixture/unready_db
      OPENROUTER_API_KEY_PROFILER_FILE: /run/fixture/openrouter_key
      EMMET_FIXTURE_MODE: /run/fixture/provider-mode.json
      AI_DATABASE_NAME: ai_db_staging
      PROFILING_APP_DB_ROLE: ai_profiler_service
    volumes:
    - smoke-data:/run/fixture:ro
    profiles:
    - faults
volumes:
  smoke-data: {}
  smoke-postgres: {}
  search-cache: {}
  console-cache: {}
networks:
  backend:
    internal: true
  console-ingress: {}
