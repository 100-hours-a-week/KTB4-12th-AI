# Default AI services. Existing env/Secrets injection; no budget gateway.
name: seonjalal-ai
x-app:
  network_mode: service:mesh
  read_only: true
  init: true
  cap_drop: &id001
  - ALL
  security_opt: &id002
  - no-new-privileges:true
  tmpfs: &id003
  - /tmp:uid=10001,gid=10001,mode=0700
  - /run/runtime:uid=10001,gid=10001,mode=0700
  restart: 'no'
services:
  mesh:
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: mesh
    networks:
    - backend
    - egress
    ports:
    - 127.0.0.1:${INTEGRATION_CHAT_PORT:-18860}:7860
    - 127.0.0.1:${INTEGRATION_PROFILER_PORT:-18861}:8001
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - postgres-data:/var/lib/postgresql/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ai_search_service -d ${AI_DATABASE_NAME:?one prepared application
        database}
      interval: 3s
      timeout: 3s
      retries: 20
  search:
    network_mode: service:mesh
    read_only: true
    init: true
    cap_drop: *id001
    security_opt: *id002
    tmpfs: *id003
    restart: 'no'
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: search
    command:
    - search
    depends_on:
      mesh:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:?existing internal service token}
      SEARCH_CATALOG_DATABASE_URL: ${SEARCH_CATALOG_DATABASE_URL:?existing Search role DSN}
      SEARCH_MEDIA_ROOT: /media
      PORT: '8000'
      AI_DATABASE_NAME: ${AI_DATABASE_NAME:?one prepared application database}
      AI_DATABASE_HOST: ${AI_DATABASE_HOST:-postgres}
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-develop}
    volumes:
    - search-cache:/runtime
    - type: bind
      source: ${EMMET_MODEL_DIR:?existing verified models directory}
      target: /assets/models
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${EMMET_MEDIA_DIR:?existing catalog media directory}
      target: /media
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - integration.containers.health
      - search
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 10
  profiler:
    network_mode: service:mesh
    read_only: true
    init: true
    cap_drop: *id001
    security_opt: *id002
    tmpfs: *id003
    restart: 'no'
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: profiler
    command:
    - profiler
    depends_on:
      mesh:
        condition: service_started
      postgres:
        condition: service_healthy
      search:
        condition: service_healthy
    environment:
      AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:?existing internal service token}
      PROFILING_DATABASE_URL: ${PROFILING_DATABASE_URL:?existing Profiler role DSN}
      PROFILING_APP_DB_ROLE: ai_profiler_service
      OPENROUTER_API_KEY_PROFILER: ${OPENROUTER_API_KEY_PROFILER:?existing Profiler provider key}
      BE_SERVICE_TOKEN: ${BE_SERVICE_TOKEN:?existing common BE service token}
      PROFILING_BACKEND_BASE_URL: ${PROFILING_BACKEND_BASE_URL:?authorized Backend
        callback origin}
      PROFILING_BE_GRANTS_ENABLED: 'true'
      PORT: '8001'
      AI_DATABASE_NAME: ${AI_DATABASE_NAME:?one prepared application database}
      AI_DATABASE_HOST: ${AI_DATABASE_HOST:-postgres}
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-develop}
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - integration.containers.health
      - profiler
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 10
  chat:
    network_mode: service:mesh
    read_only: true
    init: true
    cap_drop: *id001
    security_opt: *id002
    tmpfs: *id003
    restart: 'no'
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: chat
    command:
    - chat
    depends_on:
      mesh:
        condition: service_started
      postgres:
        condition: service_healthy
      search:
        condition: service_healthy
    environment:
      AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:?existing internal service token}
      DATABASE_URL: ${DATABASE_URL:?existing Chat role DSN}
      OPENROUTER_API_KEY_CHAT: ${OPENROUTER_API_KEY_CHAT:?existing Chat provider key}
      BE_SERVICE_TOKEN: ${BE_SERVICE_TOKEN:?existing common BE service token}
      CHAT_PROFILE_READER_URL: http://127.0.0.1:8001
      SESSION_SECRET: ${SESSION_SECRET:?existing session secret}
      QA_ADMIN_PASSWORD: ${QA_ADMIN_PASSWORD:?existing admin password}
      DEMO_ACCESS_TOKEN: ${DEMO_ACCESS_TOKEN:?existing demo token}
      SEARCH_URL: http://127.0.0.1:8000
      SEARCH_TOKEN: ''
      INTERNAL_URL: http://127.0.0.1:7860
      COOKIE_SECURE: 'false'
      CHAT_MEDIA_ROOT: /media
      PORT: '7860'
      AI_DATABASE_NAME: ${AI_DATABASE_NAME:?one prepared application database}
      AI_DATABASE_HOST: ${AI_DATABASE_HOST:-postgres}
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-develop}
    volumes:
    - type: bind
      source: ${EMMET_MEDIA_DIR:?existing catalog media directory}
      target: /media
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - integration.containers.health
      - chat
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    profiles:
    - migration
    build:
      context: ../..
      dockerfile: integration/containers/Dockerfile
      target: migrate
    command:
    - --database
    - ${AI_DATABASE_NAME:?one prepared application database}
    - --emmet
    networks:
    - backend
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?existing migration role DSN}
      AI_DATABASE_HOST: ${AI_DATABASE_HOST:-postgres}
    restart: 'no'
volumes:
  postgres-data:
    external: true
    name: ${EMMET_POSTGRES_VOLUME:?prepared separate Linux PostgreSQL18 QA volume}
  search-cache: {}
networks:
  backend:
    internal: true
  egress: {}
