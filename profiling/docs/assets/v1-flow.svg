<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#77818b"/></marker>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#18212b}.title{font-size:30px;font-weight:700;letter-spacing:-.6px}.head{font-size:15px;font-weight:700}.sub{font-size:12.5px;fill:#5e6873}.msg{font-size:13.5px;fill:#18212b}.mono{font-family:Menlo,ui-monospace,monospace;font-size:12.5px;fill:#3f4a54}.small{font-size:13px;fill:#5e6873}.num{font-size:12px;font-weight:700;fill:#fff}
.life{stroke:#c9d0d6;stroke-width:1.2;stroke-dasharray:4 4}.call{fill:none;stroke:#3b6fb6;stroke-width:1.7;marker-end:url(#a)}.ret{fill:none;stroke:#77818b;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#r)}.act{fill:#dfe8f5;stroke:#9db0d2;stroke-width:1}.note{fill:#fffbe6;stroke:#e6d98a;stroke-width:1}.rule{stroke:#d9dee3;stroke-width:1}</style></defs><rect width="1460" height="1030" fill="white"/>
<text x="40" y="48" class="title">v1 프로파일링 한 건 — 파일 사이의 호출 순서 (7.6 접수 → 202 → 백그라운드 → 7.7 콜백)</text>
<text x="40" y="74" class="small">실선 파랑 = 호출, 점선 회색 = 반환. 노란 상자 = 그 시점에 쓰는 자료형(transport/schemas.py = 바깥 계약 camelCase · profile/types.py = 내부 snake_case). 조립(main.py)은 맨 아래.</text>
<rect x="35.0" y="100" width="150" height="58" rx="4" fill="#fff" stroke="#bcc5cd" stroke-width="1.3"/>
<text x="110" y="122" class="head" text-anchor="middle">Backend</text>
<text x="110" y="140" class="sub" text-anchor="middle">(내일: 실제 · 오늘: curl)</text>
<line x1="110" y1="158" x2="110" y2="905" class="life"/>
<rect x="255.0" y="100" width="190" height="72" rx="4" fill="#fff" stroke="#bcc5cd" stroke-width="1.3"/>
<text x="350" y="122" class="head" text-anchor="middle">transport/profile_intake.py</text>
<text x="350" y="140" class="sub" text-anchor="middle">Transport · 7.6 접수</text>
<text x="350" y="154" class="sub" text-anchor="middle">run_and_callback() (Supervisor 슬롯)</text>
<line x1="350" y1="172" x2="350" y2="905" class="life"/>
<rect x="505.0" y="100" width="190" height="72" rx="4" fill="#fff" stroke="#bcc5cd" stroke-width="1.3"/>
<text x="600" y="122" class="head" text-anchor="middle">profile/pipeline.py</text>
<text x="600" y="140" class="sub" text-anchor="middle">to_internal · needs_model</text>
<text x="600" y="154" class="sub" text-anchor="middle">build_pool · profile()</text>
<line x1="600" y1="172" x2="600" y2="905" class="life"/>
<rect x="735.0" y="100" width="190" height="58" rx="4" fill="#fff" stroke="#bcc5cd" stroke-width="1.3"/>
<text x="830" y="122" class="head" text-anchor="middle">adapters/catalog_reader_file.py</text>
<text x="830" y="140" class="sub" text-anchor="middle">CatalogReader (파일)</text>
<line x1="830" y1="158" x2="830" y2="905" class="life"/>
<rect x="925.0" y="100" width="190" height="58" rx="4" fill="#fff" stroke="#bcc5cd" stroke-width="1.3"/>
<text x="1020" y="122" class="head" text-anchor="middle">adapters/profile_run_store_memory.py</text>
<text x="1020" y="140" class="sub" text-anchor="middle">ProfileRunStore (메모리)</text>
<line x1="1020" y1="158" x2="1020" y2="905" class="life"/>
<rect x="1115.0" y="100" width="190" height="58" rx="4" fill="#fff" stroke="#bcc5cd" stroke-width="1.3"/>
<text x="1210" y="122" class="head" text-anchor="middle">adapters/backend_port_http.py</text>
<text x="1210" y="140" class="sub" text-anchor="middle">BackendPort (HTTP)</text>
<line x1="1210" y1="158" x2="1210" y2="905" class="life"/>
<rect x="1285.0" y="100" width="190" height="58" rx="4" fill="#fff" stroke="#bcc5cd" stroke-width="1.3"/>
<text x="1380" y="122" class="head" text-anchor="middle">tools/fake_backend</text>
<text x="1380" y="140" class="sub" text-anchor="middle">7.7 수신</text>
<line x1="1380" y1="158" x2="1380" y2="905" class="life"/>
<rect x="345" y="200" width="10" height="135" class="act"/>
<rect x="345" y="380" width="10" height="420" class="act"/>
<path d="M110 200 H342" class="call"/>
<circle cx="127.6" cy="187" r="10" fill="#3b6fb6"/><text x="127.6" y="191" text-anchor="middle" class="num">1</text>
<text x="247.6" y="194" class="msg" text-anchor="middle">POST 7.6 extract-and-pool</text>
<text x="122" y="215" class="mono">{recipientUserId, sourceVersion, dislikedCategories[≤5], giftPreference: null, reviews: []}</text>
<rect x="360" y="228" width="320" height="44" rx="3" class="note"/>
<text x="368" y="243" class="mono">body → ProfileExtractRequest  (schemas.py)</text>
<text x="368" y="258" class="mono">위반 → 400 INVALID_REQUEST · 토큰 → 401/403</text>
<path d="M350 290 H822" class="call"/>
<circle cx="367.6" cy="277" r="10" fill="#3b6fb6"/><text x="367.6" y="281" text-anchor="middle" class="num">2</text>
<text x="607.6" y="284" class="msg" text-anchor="middle">catalog.active() 있는가?  없으면 503</text>
<path d="M830 308 H358" class="ret"/>
<text x="590.0" y="303" class="small" text-anchor="middle">(version_id, products)</text>
<path d="M350 335 H118" class="call"/>
<circle cx="332.4" cy="322" r="10" fill="#3b6fb6"/><text x="332.4" y="326" text-anchor="middle" class="num">3</text>
<text x="212.4" y="329" class="msg" text-anchor="middle">202 SuccessResponse[ProfileAccepted]</text>
<text x="120" y="352" class="mono">profileStatus = PENDING</text>
<text x="350" y="372" class="small" text-anchor="middle">── 여기서 HTTP 응답 끝. 아래는 Supervisor 슬롯 안의 백그라운드 (같은 프로세스, 응답과 무관) ──</text>
<path d="M350 400 H592" class="call"/>
<circle cx="367.6" cy="387" r="10" fill="#3b6fb6"/><text x="367.6" y="391" text-anchor="middle" class="num">4</text>
<text x="492.6" y="394" class="msg" text-anchor="middle">to_internal(body)</text>
<path d="M600 418 H358" class="ret"/>
<text x="475.0" y="413" class="small" text-anchor="middle">ProfileRequest  (types.py, snake_case)</text>
<path d="M350 450 H592" class="call"/>
<circle cx="367.6" cy="437" r="10" fill="#3b6fb6"/><text x="367.6" y="441" text-anchor="middle" class="num">5</text>
<text x="492.6" y="444" class="msg" text-anchor="middle">profile(rq, catalog=, store=)</text>
<rect x="595" y="450" width="10" height="240" class="act"/>
<rect x="615" y="462" width="330" height="44" rx="3" class="note"/>
<text x="623" y="477" class="mono">needs_model(rq) → False   (결정 c: 취향 null · 리뷰 [])</text>
<text x="623" y="492" class="mono">→ extract · validate 건너뜀</text>
<path d="M600 530 H822" class="call"/>
<circle cx="617.6" cy="517" r="10" fill="#3b6fb6"/><text x="617.6" y="521" text-anchor="middle" class="num">6</text>
<text x="732.6" y="524" class="msg" text-anchor="middle">active()</text>
<path d="M830 548 H608" class="ret"/>
<text x="715.0" y="543" class="small" text-anchor="middle">(1, [ProductRecord…])</text>
<rect x="615" y="562" width="420" height="59" rx="3" class="note"/>
<text x="623" y="577" class="mono">validation = ValidationResult(disliked_tags=비선호 이름, 나머지 [])</text>
<text x="623" y="592" class="mono">search = build_pool(products, 비선호 제외, 30)  (결정 a)</text>
<text x="623" y="607" class="mono">outcome = ProfileOutcome(RESULT_READY, validation, search)</text>
<path d="M600 650 H1012" class="call"/>
<circle cx="617.6" cy="637" r="10" fill="#3b6fb6"/><text x="617.6" y="641" text-anchor="middle" class="num">7</text>
<text x="827.6" y="644" class="msg" text-anchor="middle">save(outcome)</text>
<path d="M1020 668 H608" class="ret"/>
<text x="810.0" y="663" class="small" text-anchor="middle"></text>
<path d="M600 690 H358" class="ret"/>
<text x="475.0" y="685" class="small" text-anchor="middle">ProfileOutcome</text>
<rect x="360" y="705" width="330" height="44" rx="3" class="note"/>
<text x="368" y="720" class="mono">if outcome.status == RESULT_READY  → 콜백</text>
<text x="368" y="735" class="mono">FAILED 이면 콜백 없음 (AI는 침묵, Backend가 판정)</text>
<path d="M350 775 H1202" class="call"/>
<circle cx="367.6" cy="762" r="10" fill="#3b6fb6"/><text x="367.6" y="766" text-anchor="middle" class="num">8</text>
<text x="797.6" y="769" class="msg" text-anchor="middle">send_profile_callback(outcome)</text>
<rect x="1205" y="775" width="10" height="105" class="act"/>
<rect x="1000" y="788" width="330" height="44" rx="3" class="note"/>
<text x="1008" y="803" class="mono">to_callback(outcome) → ProfileCallbackRequest</text>
<text x="1008" y="818" class="mono">태그 없음 · recommendedProductIds ≤30  (DR-035)</text>
<path d="M1210 848 H1372" class="call"/>
<circle cx="1227.6" cy="835" r="10" fill="#3b6fb6"/><text x="1227.6" y="839" text-anchor="middle" class="num">9</text>
<text x="1312.6" y="842" class="msg" text-anchor="middle">POST 7.7</text>
<path d="M1380 866 H1218" class="ret"/>
<text x="1295.0" y="861" class="small" text-anchor="middle">200 / 409 / 400 / 5xx</text>
<path d="M1210 884 H358" class="ret"/>
<text x="780.0" y="879" class="small" text-anchor="middle">RunStatus  DELIVERED · SUPERSEDED · FAILED · RESULT_READY(재시도 대상)</text>
<text x="350" y="900" class="small" text-anchor="middle">log.info("7.7 콜백 결과 … → DELIVERED")   ※ 실행 기록 상태 갱신·재시도는 DB adapter 뒤(#23)</text>
<line x1="40" y1="919" x2="1420" y2="919" class="rule"/>
<text x="40" y="945" class="small">조립 (main.py, 시작 1회):  lifespan에서 FileCatalogReader(settings.CATALOG_FILE) · MemoryProfileRunStore() · HttpBackendPort(settings.BACKEND_BASE_URL, token)를 만들어 app.state에 두고, 라우터는 Depends로 꺼내 pipeline에 넘긴다.</text>
<text x="40" y="967" class="small">의존 방향:  api → pipeline → ports(Protocol 모양)  ←구현─ adapters.   pipeline은 adapters 파일을 import하지 않는다. 테스트(tests/unit)는 ports 모양의 가짜를 넣어 5·6·7만 돌린다.</text>
<text x="40" y="989" class="small">v3에서 바뀌는 곳: 5단계 안에서 needs_model → True면 카탈로그 조인 → ProfileModel.analyze() → validator → Search. 1~4, 7~9는 그대로.</text>
</svg>
