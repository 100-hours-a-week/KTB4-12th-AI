<text x="40" y="46" class="title">DB 전환 — 실행 기록·수신자 프로필을 PostgreSQL 두 테이블로 (v1, 2026-09-23)</text>
<text x="40" y="70" class="small">파랑 = 새로 생긴 코드 · 회색 = 그대로 · 빨강 번호 = DB 쓰기</text>
