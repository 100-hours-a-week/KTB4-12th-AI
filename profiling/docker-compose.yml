# 로컬에서 DB + 마이그레이션 + 앱을 한 번에. 팀원 골격의 compose(ai-db)와 같은 이미지 · DB 이름을 쓴다.
#
#   docker compose up -d --build     ai-db(健康) → ai-migrate(한 번 돌고 종료) → ai-app
#   docker compose logs -f ai-app    로그
#   docker compose down              중지 (데이터까지 지우려면 -v)
#
# 뜨는 순서가 중요하다: 마이그레이션이 **앱보다 먼저, 한 번만** 돌아야 한다 (앱을 여러 개로 늘려도 마찬가지).
# 카탈로그 적재는 앱과 별개다 — `docker compose run --rm ai-migrate python -m tools.catalog.load_catalog --bundle <카탈로그 합본> --if-empty`
#   (ai-migrate 는 소유자 계정이라 적재가 된다. ai-app 은 앱 전용 계정이라 카탈로그를 읽기만 한다)
#
# 계정 · 비밀번호 · 토큰 · BE 주소는 이 파일에 두지 않는다(10-15 보안 정리). 같은 폴더의 .env(저장소에 안 올라감)에서 읽고,
# 없으면 compose 가 멈춘다. 값 목록은 프로파일링 담당에게 받는 로컬 설정 템플릿을 본다.
services:
  ai-db:
    image: pgvector/pgvector:pg16
    container_name: profiling-ai-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_chat
      POSTGRES_USER: ${PROFILING_LOCAL_DB_USER:?.env 에 PROFILING_LOCAL_DB_USER}
      POSTGRES_PASSWORD: ${PROFILING_LOCAL_DB_PASSWORD:?.env 에 PROFILING_LOCAL_DB_PASSWORD}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ai_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 마이그레이션 — 앱과 같은 이미지로 한 번 돌고 종료한다 (restart: no)
  ai-migrate:
    build: .
    image: profiling-ai-app
    container_name: profiling-ai-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      PROFILING_DATABASE_URL: postgresql+psycopg://${PROFILING_LOCAL_DB_USER}:${PROFILING_LOCAL_DB_PASSWORD}@ai-db:5432/ai_chat   # 소유자 — 표를 만들고 바꾸는 계정
      # 마이그레이션이 앱 전용 계정을 이 이름 · 비밀번호로 만든다
      PROFILING_APP_DB_ROLE: ${PROFILING_APP_DB_ROLE:?.env 에 PROFILING_APP_DB_ROLE}
      PROFILING_APP_DB_PASSWORD: ${PROFILING_APP_DB_PASSWORD:?.env 에 PROFILING_APP_DB_PASSWORD}
    depends_on:
      ai-db:
        condition: service_healthy
    restart: "no"

  ai-app:
    build: .
    image: profiling-ai-app
    container_name: profiling-ai-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 앱은 앱 전용 계정(ai_profile 읽기·쓰기, ai_catalog 읽기만)으로. 슈퍼유저로 접속하면 기동 거부
      PROFILING_DATABASE_URL: postgresql+psycopg://${PROFILING_APP_DB_ROLE}:${PROFILING_APP_DB_PASSWORD}@ai-db:5432/ai_chat
      PROFILING_DB_REFUSE_SUPERUSER: "true"
      PROFILING_CATALOG_SOURCE: db                  # 컨테이너 안에는 카탈로그 파일이 없다
      # 동시 분석 수(슬롯). 배포 기본 8 — 10-14 부하 시험에서 BE 틱 최대(분당 150명) · 1만 명 재분석을 503 없이 받음(DR-041).
      # 코드 기본값(settings.py)은 1 그대로 — 로컬 개발 · 단위 시험용. 커넥션 풀은 슬롯 + IO_THREADS(=12)로 자동
      PROFILING_SLOTS: ${PROFILING_SLOTS:-8}
      PROFILING_BACKEND_BASE_URL: ${PROFILING_BACKEND_BASE_URL:?.env 에 PROFILING_BACKEND_BASE_URL}
      PROFILING_SERVICE_TOKEN: ${PROFILING_SERVICE_TOKEN:?.env 에 PROFILING_SERVICE_TOKEN}
      PROFILING_LOG_LEVEL: ${PROFILING_LOG_LEVEL:-INFO}
    depends_on:
      ai-db:
        condition: service_healthy
      ai-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]   # Liveness(10-15). 준비 여부는 /readyz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ai_pgdata:
