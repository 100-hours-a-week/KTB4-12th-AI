# 로컬에서 DB + 마이그레이션 + 앱을 한 번에. 팀원 골격의 compose(ai-db)와 같은 이미지·DB·계정 이름을 쓴다.
#
#   docker compose up -d --build     ai-db(健康) → ai-migrate(한 번 돌고 종료) → ai-app
#   docker compose logs -f ai-app    로그
#   docker compose down              중지 (데이터까지 지우려면 -v)
#
# 뜨는 순서가 중요하다: 마이그레이션이 **앱보다 먼저, 한 번만** 돌아야 한다 (앱을 여러 개로 늘려도 마찬가지).
# 카탈로그 적재는 앱과 별개다 — `docker compose run --rm ai-migrate python -m tools.catalog.load_catalog --package … --id-map … --category-id-map …`
#   (ai-migrate 는 소유자 계정이라 적재가 된다. ai-app 은 앱 전용 계정이라 카탈로그를 읽기만 한다)
services:
  ai-db:
    image: pgvector/pgvector:pg16
    container_name: profiling-ai-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_chat
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 마이그레이션 — 앱과 같은 이미지로 한 번 돌고 종료한다 (restart: no)
  ai-migrate:
    build: .
    image: profiling-ai-app
    container_name: profiling-ai-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      PROFILING_DATABASE_URL: postgresql+psycopg://ai_user:ai_password@ai-db:5432/ai_chat   # 소유자 — 표를 만들고 바꾸는 계정
      # 마이그레이션이 앱 전용 계정(로컬 기본 이름 ai_app — 서버는 PROFILING_APP_DB_ROLE 로 비공개 이름)을 이 비밀번호로 만든다. ai_app_password 는 로컬 전용 기본값(공개 저장소에 적혀 있음) —
      # 운영 · 개발 서버는 반드시 PROFILING_APP_DB_PASSWORD 를 넣는다(이미 계정이 있는 DB 는 소유자 계정으로 ALTER ROLE ai_app LOGIN PASSWORD '…')
      PROFILING_APP_DB_PASSWORD: ${PROFILING_APP_DB_PASSWORD:-ai_app_password}
    depends_on:
      ai-db:
        condition: service_healthy
    restart: "no"

  ai-app:
    build: .
    image: profiling-ai-app
    container_name: profiling-ai-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 앱은 앱 전용 계정(ai_profile 읽기·쓰기, ai_catalog 읽기만)으로. 슈퍼유저로 접속하면 기동 거부
      PROFILING_DATABASE_URL: postgresql+psycopg://ai_app:${PROFILING_APP_DB_PASSWORD:-ai_app_password}@ai-db:5432/ai_chat
      PROFILING_DB_REFUSE_SUPERUSER: "true"
      PROFILING_CATALOG_SOURCE: db                  # 컨테이너 안에는 카탈로그 파일이 없다
      # 동시 분석 수(슬롯). 배포 기본 8 — 10-14 부하 시험에서 BE 틱 최대(분당 150명) · 1만 명 재분석을 503 없이 받음(DR-041).
      # 코드 기본값(settings.py)은 1 그대로 — 로컬 개발 · 단위 시험용. 커넥션 풀은 슬롯 + IO_THREADS(=12)로 자동
      PROFILING_SLOTS: ${PROFILING_SLOTS:-8}
      # Backend 주소·토큰은 배포 환경에서 넣는다. 로컬 기본값은 호스트 :8081(로컬 BE 를 띄운 주소로 바꿔 쓴다).
      PROFILING_BACKEND_BASE_URL: ${PROFILING_BACKEND_BASE_URL:-http://host.docker.internal:8081}
      # dev-token 은 로컬 전용 기본값(공개 저장소에 적혀 있음) — 운영 · 개발 서버는 반드시 PROFILING_SERVICE_TOKEN 을 넣는다.
      # compose 는 파일 전체 변수를 한 번에 검사해 필수(:?)로 두면 로컬 DB 만 켜는 것도 멈춘다 → 운영 차단은 앱 기동 검사로(다음 작업)
      PROFILING_SERVICE_TOKEN: ${PROFILING_SERVICE_TOKEN:-dev-token}
      PROFILING_LOG_LEVEL: ${PROFILING_LOG_LEVEL:-INFO}
    depends_on:
      ai-db:
        condition: service_healthy
      ai-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]   # Liveness(10-15). 준비 여부는 /readyz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ai_pgdata:
