<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대화 검토 · 선잘알</title><link rel="stylesheet" href="/static/admin.css"><script src="/static/http.js" defer></script><script src="/static/admin.js" defer></script></head><body><main>
<header><div><a href="/">← 채팅 테스트</a><h1>대화 검토</h1></div><button id="logout" hidden>로그아웃</button><a href="/admin/reports">대화 신고 포함 전체 신고</a></header>
<form id="login"><label>관리자 비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form><p id="status" role="status" aria-live="polite"></p>
<section id="workspace" hidden><form id="filters"><label class="search">질문 검색<input name="q" maxlength="200" placeholder="예: 집들이, 드립백"></label><label>응답 상태<select name="status"><option value="">전체</option><option value="FAILED">실패</option><option value="CANCELLED">취소</option><option value="PROCESSING">생성 중</option><option value="COMPLETED">완료</option></select></label><label>의견<select name="feedback"><option value="all">전체 대화</option><option value="any">의견 있는 대화</option><option value="pending">미검토 의견</option><option value="reviewed">검토한 의견</option></select></label><label>정렬<select name="sort"><option value="feedback">의견 최근순</option><option value="created">대화 생성순</option></select></label><label>시작일<input name="since" type="date"></label><label>종료일<input name="until" type="date"></label><button>조회</button></form>
<p class="hint">기간과 상태는 해당하는 턴이 있는 대화를 찾습니다. 각 턴에 관리자 평가 메모를 남길 수 있습니다. 의견이 있는 대화는 해당 질문과 앞뒤 맥락으로 바로 이동합니다.</p>
<div class="split"><aside aria-label="대화 목록"><div id="items"></div><button id="more" hidden>대화 더 보기</button></aside><section id="detail" aria-label="대화 상세"><div class="empty">왼쪽에서 대화를 선택해 주세요.<br>피드백이 없는 대화도 확인할 수 있습니다.</div></section></div></section>
</main></body></html>
