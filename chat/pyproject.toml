[project]
name = "ktb-chat"
version = "1.5.2"
description = "Stored-event chat API and free integration fixtures"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.43.114",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "psycopg[binary,pool]==3.3.6",
  "uvicorn==0.54.0",
  "websockets==16.1.1",
]

[dependency-groups]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../profiling/src"]
addopts = "-p no:cacheprovider"

[tool.uv]
constraint-dependencies = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "certifi==2026.7.22",
  "click==8.5.0",
  "fastapi==0.141.1",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.20",
  "itsdangerous==2.2.0",
  "psycopg==3.3.6",
  "psycopg-binary==3.3.6 ; implementation_name != 'pypy'",
  "psycopg-pool==3.3.3",
  "pydantic==2.13.5",
  "pydantic-core==2.46.5",
  "starlette==1.7.0",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
  "tzdata==2026.4 ; sys_platform == 'win32'",
  "uvicorn==0.54.0",
  "websockets==16.1.1",
]
